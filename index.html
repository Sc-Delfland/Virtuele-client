<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Oefenapp voor vmbo Zorg &amp; Welzijn, profielmodule Mens &amp; Zorg, in de opbouw van het cspe onderdeel D.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Virtuele Cliënt Mens &amp; Zorg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: opdrachtenboekje — smalle inhoudsrail links, één 'pagina' rechts; punten in de kantlijn zoals in het cspe-boekje */
:root{
  --paper:#eef2f8; --sheet:#ffffff; --ink:#13213a; --muted:#56637c; --line:#d6dde9;
  --blue:#1f4fbf; --blue-soft:#e3ebfb; --blue-ink:#ffffff;
  --coral:#d9482b; --coral-soft:#fde8e3;
  --ok:#17804f; --ok-soft:#dff3e8; --bad:#c2342a; --bad-soft:#fbe3e1; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --bubble-c:#f1f4f9; --stage:#dfe7f3; --stage2:#c9d6ea;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1522; --sheet:#162034; --ink:#e5ebf6; --muted:#9ba8c2; --line:#2a3752;
  --blue:#7ea4ff; --blue-soft:#1d2c4c; --blue-ink:#0e1522;
  --coral:#ff7b5e; --coral-soft:#3a1d17;
  --ok:#4cc58c; --ok-soft:#133426; --bad:#ff6d62; --bad-soft:#3b1a1a; --warn:#e6b450; --warn-soft:#352a12;
  --bubble-c:#1e2a42; --stage:#1b2740; --stage2:#24345a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1522; --sheet:#162034; --ink:#e5ebf6; --muted:#9ba8c2; --line:#2a3752;
  --blue:#7ea4ff; --blue-soft:#1d2c4c; --blue-ink:#0e1522;
  --coral:#ff7b5e; --coral-soft:#3a1d17;
  --ok:#4cc58c; --ok-soft:#133426; --bad:#ff6d62; --bad-soft:#3b1a1a; --warn:#e6b450; --warn-soft:#352a12;
  --bubble-c:#1e2a42; --stage:#1b2740; --stage2:#24345a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.topctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.who{font-size:.9rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.ghost{border-color:var(--line)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start;margin-bottom:28px}
.hero p.lead{font-size:1.08rem;margin-top:10px;max-width:60ch}
.card{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.form{display:grid;gap:12px}
.form label{font-weight:700;font-size:.92rem;display:grid;gap:6px}
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cover{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:0;text-align:left;display:flex;flex-direction:column;min-height:300px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.cover:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.cover .band{background:var(--blue);color:var(--blue-ink);padding:12px 16px;font-family:var(--f-display);font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cover .band small{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.cover .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cover .place{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.cover .meta{font-size:.85rem;color:var(--muted)}
.cover .prog{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--sheet)}
.chip.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.blue{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

/* case */
.casegrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.rail .back{margin-bottom:10px}
.tab{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-weight:700}
.tab .n{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--muted)}
.tab .p{font-size:.78rem;color:var(--muted);font-weight:700}
.tab[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.tab[aria-current="true"] .n,.tab[aria-current="true"] .p{color:var(--sheet)}
.tab .st{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:end}
.tab .st.ok{background:var(--ok)}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:28px;min-width:0}
.opd{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 12px}
.opd .marg{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding-top:4px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.opd .marg .pt{color:var(--coral)}
.opd .marg .nr{font-size:1.6rem;line-height:1}
.opd .content{display:flex;flex-direction:column;gap:16px;min-width:0}
.boekje{border-left:4px solid var(--blue);background:var(--blue-soft);padding:14px 16px;border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:8px}
.boekje ul{margin:0;padding-left:20px}
.rule{font-size:.9rem;font-style:italic;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-display);font-size:1.4rem}
details.docent{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px}
details.docent summary{font-weight:700;cursor:pointer}
details.docent .crit{margin-top:10px;display:grid;gap:10px}
details.docent ul{margin:4px 0 0;padding-left:20px}

/* timer */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.timer .clock{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;min-width:4.2ch}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;text-align:left;min-height:48px}
.opt .l{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .l{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--blue)}
.expl{font-size:.92rem;border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}

/* chat */
.chatgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.chatbox{border:1.5px solid var(--line);border-radius:12px;display:flex;flex-direction:column;height:560px;min-width:0;background:var(--sheet)}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--coral-soft);color:var(--coral);flex:none}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.c{background:var(--bubble-c);border-bottom-left-radius:4px;align-self:flex-start}
.msg.s{background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.a{align-self:center;background:transparent;border:1.5px dashed var(--line);font-style:italic;color:var(--muted);font-size:.9rem;max-width:92%;text-align:center}
.msg.n.warnnote{color:var(--warn);font-weight:700}
.msg.n{align-self:center;font-size:.88rem;color:var(--muted);text-align:center;max-width:92%}
.msg em{font-style:italic;opacity:.85}
.typing{align-self:flex-start;color:var(--muted);font-size:.88rem;font-style:italic}
.composer{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--line)}
.composer input{flex:1;min-width:0}
.actions{display:flex;flex-direction:column;gap:12px;min-width:0}
.agroup{display:flex;flex-direction:column;gap:6px}
.agroup h4{margin:0;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.abtn{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 10px;text-align:left;font-size:.92rem;min-height:40px}
.abtn:hover{border-color:var(--blue)}
.abtn.used{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.prep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.95rem}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.aiswitch{display:flex;align-items:center;gap:8px;font-size:.88rem}
.aiswitch input{width:18px;height:18px}

/* assessment */
.assess{display:flex;flex-direction:column;gap:14px}
.sec{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.sec .sh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;background:var(--paper);font-weight:700}
.sec .sh .sc{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.sec ul{list-style:none;margin:0;padding:6px 14px 12px;display:grid;gap:6px}
.sec li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:.95rem}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;margin-top:1px}
.mark.y{background:var(--ok);color:var(--sheet)}
.mark.n{background:var(--bad);color:var(--sheet)}
.tip{display:block;font-size:.86rem;color:var(--muted)}
.total{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.total b{font-size:2.2rem;font-weight:800}

/* order */
.ordergrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.pool,.seq{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.pool h4,.seq h4{margin:0 0 2px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stepc{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 10px;text-align:left;font-size:.93rem;min-height:44px}
.stepc .no{font-family:var(--f-display);font-weight:800;color:var(--blue)}
.stepc .mv{display:flex;gap:4px}
.stepc .mv button{border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;width:32px;height:32px;display:grid;place-items:center;font-weight:800}
.stepc.right{border-color:var(--ok);background:var(--ok-soft)}
.stepc.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mat{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.88rem;font-weight:700;min-height:104px}
.mat svg{width:34px;height:34px}
.mat[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.mat.right{border-color:var(--ok);background:var(--ok-soft)}
.mat.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* film */
.player{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sheet)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--stage) 0 68%,var(--stage2) 68% 100%);overflow:hidden}
.stage .fig{position:absolute;bottom:8%;width:22%;transition:transform .4s}
.stage .fig.s{left:10%}
.stage .fig.c{right:10%}
.stage .fig.talk{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3%)}}
.stage .tag{position:absolute;bottom:2%;font-size:.75rem;font-weight:700;background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.stage .tag.s{left:12%}
.stage .tag.c{right:12%}
.stage .bubble{position:absolute;top:7%;max-width:44%;background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:clamp(.78rem,1.8vw,1rem);font-weight:700;line-height:1.3}
.stage .bubble.s{left:6%}
.stage .bubble.c{right:6%}
.stage .actcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:clamp(.7rem,1.5vw,.9rem)}
.stage .actcard svg{width:clamp(28px,6vw,48px);height:clamp(28px,6vw,48px);color:var(--ink)}
.stage .flash{position:absolute;inset:0;border:6px solid var(--coral);pointer-events:none;opacity:0;transition:opacity .2s}
.stage .flash.on{opacity:1}
.stage .fig svg{width:100%;height:auto;display:block}
.stage .playcover{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 45%,transparent);cursor:pointer}
.stage .playcover span{background:var(--sheet);color:var(--ink);border-radius:999px;padding:12px 22px;font-weight:800;font-family:var(--f-display)}
.subs{padding:10px 14px;min-height:3.2em;border-top:1.5px solid var(--line);font-size:.95rem}
.ctrl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1.5px solid var(--line);flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:10px;background:var(--line);border-radius:5px;position:relative;cursor:pointer}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:5px}
.bar .flag{position:absolute;top:-4px;width:4px;height:18px;background:var(--coral);border-radius:2px}
.time{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted)}
.scorepick{display:flex;gap:8px;flex-wrap:wrap}
.scorepick button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700}
.scorepick button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.errlist{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.errlist li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:.93rem}
video{width:100%;border-radius:10px;background:#000}
.kw{width:100%;border-collapse:collapse;font-size:.92rem}
.kw th,.kw td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.kw td.c{text-align:center;width:64px}
.kw input{width:18px;height:18px}
.tablewrap{overflow-x:auto}
.restab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.restab th,.restab td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
.restab td.r,.restab th.r{text-align:right}
.restab tfoot td{font-weight:800;font-family:var(--f-display);font-size:1.1rem;border-bottom:0}
.note{font-size:.82rem;color:var(--muted);max-width:75ch}
.inline-confirm{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.disp{display:flex;margin-top:6px}
.disp[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.facet{gap:14px}
.qq{font-weight:700}
.mcl{display:grid;gap:6px}
.mco{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.mco input{width:18px;height:18px}
.mco.right{background:var(--ok-soft)}.mco.wrong{background:var(--bad-soft)}
.mx,.qtab{border-collapse:collapse;font-size:.95rem;min-width:100%}
.mx th,.mx td,.qtab th,.qtab td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
.mx th{font-size:.85rem;text-align:center}
.mx td.c{text-align:center;width:96px;white-space:nowrap}
.mx td.c input{width:18px;height:18px}
.mx td.c .ok{color:var(--ok);font-weight:800;margin-left:4px}
.mx tr.right td:first-child{background:var(--ok-soft)}.mx tr.wrong td:first-child{background:var(--bad-soft)}
.qtab caption{font-weight:700;text-align:left;padding-bottom:6px}
.qtab thead th{background:var(--blue-soft)}
.mt{display:grid;gap:8px}
.mtr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mtr .tip{grid-column:2}
.mtr.right{background:var(--ok-soft)}.mtr.wrong{background:var(--bad-soft)}
@media (max-width:560px){.mtr{grid-template-columns:1fr}.mtr .tip{grid-column:1}.mx td.c{width:64px}}

const shuffle=(a)=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};

/* chat helpers */
function did(st,id){ return st.done[id]!==undefined; }
function before(st,a,b){ return did(st,a) && (!did(st,b) || st.done[a]<st.done[b]); }
function uForm(st){ return st.uCount>0 && st.jeCount===0 && !st.flags.rude; }

/* scoring */
const MAX=()=>S.level==='bb'?{o1:5,o2:9,o3:9,o4:2}:{o1:6,o2:8,o3:9,o4:2};
function scoreSection(sec, st){
  sec={...sec, max:(S.level==='bb'&&sec.maxBB)||sec.max};
  const res=sec.items.map(it=>({l:it.l, tip:it.tip, ok:!!it.ok(st)}));
  const n=res.filter(r=>r.ok).length, wrong=res.length-n;
  let pts=0;
  if(sec.mode==='minus') pts=Math.max(0, sec.max-wrong);
  else if(sec.mode==='all') pts= wrong===0?sec.max:0;
  else { for(const [min,p] of sec.bands){ if(n>=min){pts=p;break;} } }
  return {code:sec.code,title:sec.title,max:sec.max,pts,items:res};
}

/* ---------- OPDRACHT 1: QUIZ (Facet-stijl) ---------- */
function quizSet(c){ return S.level==='bb'?c.quizBB:c.quizKB; }
function prepQ(q){
  if(q.t==='mc'){ const r=shufQ(q); return r; }
  if(q.t==='matrix') return {...q, rows:shuffle(q.rows)};
  if(q.t==='match') return {...q, items:shuffle(q.items)};
  return q;
}
function qRight(q,ans){
  if(ans===undefined) return false;
  if(q.t==='mc') return ans===q.a;
  if(q.t==='matrix') return q.rows.every((r,i)=>ans[i]===r.a);
  if(q.t==='match') return q.items.every((it,i)=>ans[i]===it.a);
  return false;
}
function qComplete(q,ans){
  if(ans===undefined) return false;
  if(q.t==='mc') return true;
  const n=q.t==='matrix'?q.rows.length:q.items.length;
  return Array.isArray(ans) && ans.filter(v=>v!==undefined&&v!==null).length===n && ans.length===n;
}
function tableHTML(t){ return t?`<div class="tablewrap"><table class="qtab"><caption>${esc(t.title)}</caption><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''; }
function qBody(q,ans,review,k=0){
  let h=(q.table?tableHTML(q.table):'')+(q.ctx?`<p>${esc(q.ctx)}</p>`:'')+`<p class="qq">${esc(q.q)}</p>`;
  if(q.t==='mc'){
    h+=`<div class="mcl">${q.o.map((o,j)=>{const cls=review?(j===q.a?'right':(j===ans?'wrong':'')):''; return `<label class="mco ${cls}"><input type="radio" name="mc${k}" data-mc="${j}" ${ans===j?'checked':''} ${review?'disabled':''}><span>${esc(o)}</span></label>`;}).join('')}</div>`;
  } else if(q.t==='matrix'){
    h+=`<div class="tablewrap"><table class="mx"><thead><tr><th></th>${q.cols.map(cn=>`<th>${esc(cn)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((r,i)=>`<tr class="${review?(ans&&ans[i]===r.a?'right':'wrong'):''}"><td>${esc(r.s)}</td>${q.cols.map((_,j)=>`<td class="c"><input type="radio" name="mx${k}_${i}" data-mx="${i}:${j}" aria-label="${esc(r.s)}: ${esc(q.cols[j])}" ${ans&&ans[i]===j?'checked':''} ${review?'disabled':''}>${review&&j===r.a?'<span class="ok">✓</span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else if(q.t==='match'){
    h+=`<div class="mt">${q.items.map((it,i)=>`<div class="mtr ${review?(ans&&ans[i]===it.a?'right':'wrong'):''}"><b>${esc(it.l)}</b><select data-mt="${i}" aria-label="${esc(it.l)}" ${review?'disabled':''}><option value="">kies …</option>${q.o.map((o,j)=>`<option value="${j}" ${ans&&ans[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select>${review&&!(ans&&ans[i]===it.a)?`<span class="tip">Goed: ${esc(q.o[it.a])}</span>`:''}</div>`).join('')}</div>`;
  }
  return h;
}
function quizView(c){
  if(runtime.quiz && runtime.quiz.lv!==S.level) runtime.quiz=null;
  const rt = runtime.quiz ||= {i:0, ans:[], done:false, lv:S.level, set:quizSet(c).map(prepQ)};
  const r=R(c.id).o1;
  if(rt.done || (r && r.lv===S.level && r.set && r.set[0] && r.set[0].t && !rt.retry && rt.ans.length===0)){
    const ans = rt.done? rt.ans : r.ans; const set = rt.done? rt.set : r.set;
    const score = set.filter((q,i)=>qRight(q,ans[i])).length;
    return `<div class="opd">${opdHead(1,MAX().o1)}<div class="content">
      <h2>Vragen maken — uitslag</h2>
      <div class="total"><b>${score}</b><span>van ${set.length} punten</span></div>
      ${set.map((q,i)=>`<div class="q card"><div class="qhead"><span class="eyebrow">Vraag ${i+1} · 1p</span><span class="chip ${qRight(q,ans[i])?'done':'bad'}">${qRight(q,ans[i])?'goed':'fout'}</span></div>${qBody(q,ans[i],true,i)}<p class="expl">${esc(q.e)}</p></div>`).join('')}
      <p class="small muted">Net als in Facet krijg je bij een vraag met meerdere regels alleen het punt als alle regels goed zijn.</p>
      <div class="row"><button class="btn ghost" id="q-retry">Opnieuw maken</button><button class="btn primary" data-go="o2">Naar opdracht 2</button></div>
    </div></div>`;
  }
  const q=rt.set[rt.i], a=rt.ans[rt.i];
  return `<div class="opd">${opdHead(1,MAX().o1)}<div class="content">
    <h2>Vragen maken</h2>
    <div class="q card facet">
      <div class="qhead"><span class="eyebrow">Vraag ${rt.i+1} van ${rt.set.length} · 1p</span><span class="dots">${rt.set.map((_,i)=>`<i class="${i<=rt.i?'on':''}"></i>`).join('')}</span></div>
      ${qBody(q,a,false,rt.i)}
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost sm" id="q-prev" ${rt.i===0?'disabled':''}>Vorige</button>
        <button class="btn primary" id="q-next" ${qComplete(q,a)?'':'disabled'}>${rt.i===rt.set.length-1?'Inleveren':'Volgende'}</button>
      </div>
    </div>
  </div></div>`;
}
function bindQuiz(c){
  const rt=runtime.quiz; bindIntro();
  const q=rt.set&&rt.set[rt.i];
  const upd=()=>{ const n=$('#q-next'); if(n) n.disabled=!qComplete(q,rt.ans[rt.i]); };
  document.querySelectorAll('[data-mc]').forEach(b=>b.onchange=()=>{ rt.ans[rt.i]=+b.dataset.mc; upd(); });
  document.querySelectorAll('[data-mx]').forEach(b=>b.onchange=()=>{ const [i,j]=b.dataset.mx.split(':').map(Number); const arr=(rt.ans[rt.i] ||= Array(q.rows.length).fill(undefined)); arr[i]=j; upd(); });
  document.querySelectorAll('[data-mt]').forEach(b=>b.onchange=()=>{ const i=+b.dataset.mt; const arr=(rt.ans[rt.i] ||= Array(q.items.length).fill(undefined)); arr[i]=b.value===''?undefined:+b.value; upd(); });
  const n=$('#q-next'); if(n) n.onclick=()=>{ if(rt.i<rt.set.length-1){rt.i++; render();} else { rt.done=true; const score=rt.set.filter((qq,i)=>qRight(qq,rt.ans[i])).length; R(c.id).o1={score,ans:rt.ans.slice(),set:rt.set,lv:S.level,max:rt.set.length}; save(); render(); window.scrollTo(0,0);} };
  const p=$('#q-prev'); if(p) p.onclick=()=>{rt.i--; render();};

function prepTimer(st,min){

function bindTimer(st){

function pushLog(st,k,t){ st.log.push({k,t}); }

function bindChat(c){

      if(!st.hintOn && !st.busy && !st.ended && Date.now()-st.lastAct>=30000){ st.hintOn=true; st.hints++; keepRender(); }
    },1000);
  }
  const pk=$('#peek'); if(pk) pk.onclick=()=>{ if(!st.peekOpen) st.peeks++; st.peekOpen=!st.peekOpen; const v=$('#say')?.value; render(); if(v) $('#say').value=v; };

  $('#composer').onsubmit=(e)=>{ e.preventDefault(); const v=$('#say').value.trim(); if(!v) return; studentSays(c,st,v); };

function runBeat(c,st){
  for(const b of c.chat.beats){
    if(st.used[b.id]) continue;
    if(b.when(st)){ st.used[b.id]=1; if(b.fx) b.fx(st); return b.line; }
  }
  return null;
}
function markDone(st,id){ if(st.done[id]===undefined) st.done[id]=++st.seq; }

function doAction(c,st,id, fromText){
  if(!fromText){ st.lastAct=Date.now(); st.hintOn=false; }
  const ch=c.chat, a=ch.actions.find(x=>x.id===id); if(!a) return [];
  const key=a.as||a.id;
  const lines=[];
  if(a.req){
    for(const r of a.req){
      if(!did(st,r)){
        if(fromText) return null;
        pushLog(st,'a', a.narr? 'Je wilt: '+a.label.toLowerCase()+'.' : a.label);
        const m=a.missing&&a.missing[r];
        st.prompted[r]=1;
        pushLog(st,'c', m || '*'+ch.short+' kijkt je vragend aan. Er moet eerst iets anders gebeuren.*');
        render(); return [];
      }
    }
  }
  if(fromText && did(st,key)) return null;
  if(!fromText) pushLog(st,'a', a.narr || a.label+'.');
  if(a.pre){ const p=a.pre(st); if(p) lines.push(p); }
  markDone(st,key);
  (st.usedAct ||= {})[a.id]=1;
  if(a.fx){ const f=a.fx(st); if(f) lines.push(f); }
  if(a.reply) lines.push(a.reply);
  if(a.end || (ch.isEnd && ch.isEnd(st))) st.ended=true;
  if(fromText) return lines;
  const beat = st.ended?null:runBeat(c,st); if(beat) lines.push(beat);
  lines.forEach(l=>pushLog(st, l.startsWith('*')&&l.endsWith('*')?'a':'c', l.startsWith('*')&&l.endsWith('*')?l.slice(1,-1):l));
  if(st.ended) pushLog(st,'n','Je bent bij het einde van de opdracht. Neem afscheid in de chat en klik dan op “Rollenspel afronden en beoordelen”.');
  render(); scrollLog();
  return lines;
}

/* ---- taalherkenning: ruim, met tolerantie voor tikfouten ---- */
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const m=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let prev=m[0]; m[0]=i; for(let j=1;j<=b.length;j++){ const tmp=m[j]; m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=tmp; } } return m[b.length]; }
function fuzzy(t,words){ const toks=t.split(/[^a-zà-ÿ]+/).filter(Boolean);
  return words.some(w=>toks.some(k=> k===w || (w.length>=5&&k.startsWith(w)) || (w.length>=6&&lev(k,w)<=1) || (w.length>=9&&lev(k,w)<=2))); }
const GREET=['goedemiddag','goedemorgen','goedenavond','goedendag','goeiemiddag','goeiemorgen','goeiedag','goeienavond','hallo','hoi','hey','hee','hai','dag','hello'];

  bye:/\b(tot ziens|tot zo|doei|doeg|daag|dag|fijne (dag|middag|avond|tijd)|prettige (dag|middag|avond)|tot (straks|morgen|later|de volgende( keer)?)|veel plezier|goede reis|beterschap|het beste|succes|houdoe)\b/,
  empathyPh:/(wat naar|rot voor|kan me (dat )?(goed )?voorstellen|niet leuk|niet fijn|klinkt|naar voor u|lijkt me|wat erg|heel erg|dat is (ook )?zwaar|vervelend voor u|ik snap|ik begrijp)/,
  interestGen:/(hoe was|hoe vond u|wat heeft u|heeft u (lekker|leuk|een fijne|een leuke|goed)|vond u het leuk|was het leuk|hoe bevalt|wat gaat u|waar heeft u zin|wat doet u graag|wat vindt u leuk)/,
  rude:/\b(stom|dom|kut|shit|tering|kanker|godver\w*|sukkel|idioot|hou je kop|schiet op|zeur|zeurt|boeie|boeien|irritant)\b/,
  instr:/(schuif|schuift|zet u|zet uw|uw voeten|leg uw|handen op|op drie|tel tot|1,? ?2,? ?3|een,? twee,? drie|leun|naar voren|voorover|draai|gaat u (maar )?zitten|staat u (maar )?op|sta(at)? op|duw|steun|rustig aan|pak(t)? (mij|me) (maar )?vast|houd? u (mij |me )?vast|papegaai|trek(t)? u (zich|uzelf)|benen over)/
};
const GENERIC_QA=[
  {re:/(hoe heet u|wat is uw naam|bent u (meneer|mevrouw))/, a:['Ja, dat ben ik: {naam}.']},
  {re:/hoe oud (bent|ben)/, a:['Oud genoeg, haha.','Dat vraag je niet zomaar, hoor! *lacht*']},
  {re:/(weer|regen|regent|zonnig|waait|wind)\b/, a:['Het is echt herfstweer, hè.','Ik hoorde dat het straks gaat regenen.']},
  {re:/(sorry|excuus|pardon|neem me niet kwalijk)/, a:['Geeft niks, hoor.','Ach, maak je niet druk.']},
  {re:/(momentje|moment|even wachten|ogenblik)/, a:['Neem je tijd.','Ik wacht wel even.']},
  {re:/(mooi|leuk|prachtig)e? (vest|trui|shirt|haar|ketting|bril|schoenen|blouse)/, a:['Dank je! Die heb ik van mijn familie gekregen.','Wat aardig dat je dat zegt.']},

function pick(st,key,arr){ st.rot ||= {}; const i=st.rot[key]||0; st.rot[key]=i+1; return arr[i%arr.length]; }

function analyse(c,st,raw){
  const t=raw.toLowerCase().replace(/[’‘]/g,"'").replace(/\bgoe(?:de|ie|i)n? ?(morgen|middag|avond|dag)\b/g,'goede$1');
  const ch=c.chat, rx=ch.re;
  st.msgs++;
  if(st.msgs<=3 && fuzzy(t,GREET)){ if(!st.said.greet) st.greetedNow=(t.match(/goede(morgen|middag|avond)/)||[])[1]||'hallo'; st.said.greet=1; }
  if(RX.intro.test(t)) st.said.intro=1;
  if(rx.purpose.test(t) && RX.purposeVerb.test(t)) st.said.purpose=1;
  if(rx.interest.test(t) || RX.interestGen.test(t)) st.said.interest=1;
  if(RX.closing.test(t)) st.said.closing=1;
  if(RX.instr.test(t)) st.said.instr=1;
  if(st.msgs>2 && RX.bye.test(t)) st.said.bye=1;
  const empText=t.replace(/naar (de|het|uw|je|huis|buiten|boven|beneden|binnen)\b/g,'');
  if(st.concernAt>=0 && st.msgs<=st.concernAt+2 && (RX.empathyPh.test(t)||fuzzy(empText,EMP))) st.empathyOk=true;
  if(RX.rude.test(t)) st.flags.rude=(st.flags.rude||0)+1;
  const uHits=(t.match(/\b(u|uw|alstublieft|dank u)\b/g)||[]).length;
  const cleaned=t.replace(/dank je( wel)?|bedankt/g,'');
  const jeHits=(cleaned.match(/\b(je|jij|jou|jouw)\b/g)||[]).length;
  st.uCount+=uHits; st.jeCount+=jeHits;
  return t;
}

async function studentSays(c,st,raw){
  const ch=c.chat; st.lastAct=Date.now();
  const g0 = st.mode!=='examen' ? nextGuide(ch,st) : null;
  st.hintOn=false;
  pushLog(st,'s',raw);
  const t=analyse(c,st,raw);
  let lines=[];
  if(st.flags.rude && !st.used['rude'+st.flags.rude]){ st.used['rude'+st.flags.rude]=1; lines.push(pick(st,'rude',['Hé, zo praat je toch niet tegen mij?','Dat vind ik niet zo aardig, hoor.'])); }
  // tekst die een handeling is (bijv. “Staat u goed?”)
  for(const ta of (ch.textActs||[])){ if(ta.re.test(t)){ const r=doAction(c,st,ta.id,true); if(r){ lines.push(...r); break; } } }
  if(st.greetedNow){ const w=st.greetedNow; st.greetedNow=null; const hardOfHearingFirst=ch.beats.some(x=>x.id==='hear1')&&st.msgs===1; if(!hardOfHearingFirst) lines.push(w==='hallo'?'Hallo!':'Goede'+w+'!'); }
  if(ch.special) lines.push(...ch.special(st,t,ch));
  if(st.ended && st.said.bye && !st.used.byeReply){ st.used.byeReply=1; lines.push(ch.bye); }
  if(!lines.length){ const qa=[...(ch.qa||[]),...GENERIC_QA].find(q=>q.re.test(t)); if(qa) lines.push(pick(st,'qa'+qa.re.source,[].concat(qa.a)).replace('{naam}',ch.short)); }
  if(!lines.length && RX.instr.test(t)) lines.push(pick(st,'instr',['*doet wat je zegt* Zo?','Oké ... *volgt je aanwijzing*','Zo goed?','*knikt en doet het*']));
  if(st.empathyOk && !st.used.empReply && st.concernAt>=0){ st.used.empReply=1; lines.push(pick(st,'emp',['Dank je. Fijn dat je dat zegt.','Ja ... dat is het ook. Fijn dat je het begrijpt.'])); }
  const beat=st.ended?null:runBeat(c,st); if(beat) lines.push(beat);
  if(g0 && g0.k==='say' && nextGuide(ch,st)===g0){ st.sayFail ||= {}; st.sayFail[g0.t]=(st.sayFail[g0.t]||0)+1;
    if(st.mode==='tussen' && st.sayFail[g0.t]>=2 && g0.opts){ st.hintOn=true; st.hints++; } }
  if(!lines.length) lines.push(t.trim().endsWith('?') ? pick(st,'fq',['Hm, dat weet ik eigenlijk niet.','Goeie vraag ...','Ik denk het wel.','Wat bedoel je precies?']) : pick(st,'fill',ch.fill));

  if(st.ai && SAMPLE){
    st.busy=true; render(); scrollLog();
    try{
      const transcript=st.log.slice(-14).map(m=>(m.k==='s'?'Stagiair: ':m.k==='c'?'Cliënt: ':'[')+m.t+(m.k==='a'||m.k==='n'?']':'')).join('\n');
      const prompt=`${ch.persona}

Je speelt deze cliënt in een oefen-rollenspel voor vmbo-leerlingen Zorg & Welzijn (examen Mens & Zorg). Regels:
- Antwoord in eenvoudig Nederlands (B1), 1 tot 3 korte zinnen. Je spreekt de stagiair aan met "je".
- Blijf in je rol. Geef geen tips, geen uitleg en geen beoordeling. Neem nooit zelf het initiatief tot zorghandelingen.
- Handelingen of non-verbaal gedrag zet je tussen *sterretjes*.

Gesprek tot nu toe:
${transcript}

Jouw antwoord moet deze inhoud bevatten (de betekenis precies behouden, je mag het natuurlijker zeggen en kort reageren op wat de stagiair zei): ${lines.join(' ')}

Geef alleen jouw antwoord als cliënt.`;
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
      const res=await Promise.race([SAMPLE(prompt,{modelTier:'quick', cache:false, signal:ctl.signal}), new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),12500))]);
      clearTimeout(to);
      const txt=(res&&res.text||'').trim();
      lines = txt? [txt.replace(/^cli[eë]nt:\s*/i,'')] : lines;
    }catch(e){ if(e&&e.code==='not_granted'){ SAMPLE=null; st.ai=false; AI_STATE='off'; AI_WHY='Je gaf geen toestemming voor AI. De cliënt werkt nu met vaste zinnen.'; }
      else { st.ai=false; AI_WHY=''; pushLog(st,'n','De AI reageerde niet op tijd. De cliënt gaat verder met vaste zinnen. Je kunt de AI later weer aanzetten.'); } }
    st.busy=false;
  }
  lines.forEach(l=>{ const act=l.startsWith('*')&&l.endsWith('*')&&l.indexOf('*',1)===l.length-1; pushLog(st, act?'a':'c', act?l.slice(1,-1):l); });
  render(); scrollLog(); $('#say')?.focus();
}

      ${allDone?(()=>{const op=qs.filter((q,k)=>st.oral[k]===q.a).length; const tot=matScore()+st.orderPts+op; R(c.id).o3={score:tot, mats:matScore(), matMax, order:st.orderPts, oral:op, oralMax:qs.length}; save();
        return `<div class="total"><b>${tot}</b><span>van 9 punten</span></div><p class="small muted">Materialen ${matScore()}/${matMax} · volgorde ${st.orderPts}/5 · ${bb?'vraag':'vragen'} ${op}/${qs.length}</p>

function orderScore(seq){ // paren in juiste volgorde → 0..5
  let ok=0,tot=0; for(let i=0;i<seq.length;i++) for(let j=i+1;j<seq.length;j++){ tot++; if(seq[i]<seq[j]) ok++; }
  const exact=seq.every((v,i)=>v===i); if(exact) return 5;
  const f=ok/tot; return f>=.95?4:f>=.85?3:f>=.7?2:f>=.55?1:0;
}

}
function errorReport(c,st,errs){
  const spotted=errs.filter(x=>st.flags.some(t=>t>=FILM.starts[x.i] && t<=FILM.starts[x.i]+x.fr.d+1.5));
  const falseFlags=st.flags.filter(t=>!errs.some(x=>t>=FILM.starts[x.i] && t<=FILM.starts[x.i]+x.fr.d+1.5)).length;
  const aspect=(k,lbl)=>`<div class="card q"><b>${lbl}</b><p class="small">Ik geef ${esc(c.film.s)} een:</p>
    <div class="scorepick">${['onvoldoende','voldoende','goed'].map(s=>`<button data-score="${k}:${s}" aria-pressed="${st.scores[k]===s}" ${st.submitted?'disabled':''}>${s}</button>`).join('')}</div>
    <label class="small" for="ex-${k}" style="font-weight:700">Leg met één voorbeeld uit waarom.</label>
    <textarea id="ex-${k}" data-ex="${k}" ${st.submitted?'disabled':''} placeholder="Bijvoorbeeld: ${k==='verband'?'hij …':'ze zei …'}">${esc(st.expl[k]||'')}</textarea></div>`;
  let html=`<section class="q">
    <h3>Terugkijken op de uitvoering van ${esc(c.film.s)}</h3>
    ${aspect('verband', c.id==='B'?'Vingerbob aanleggen':c.id==='C'?'Kompres en elastisch windsel aanbrengen':'Wonddrukverband aanleggen')}
    ${aspect('comm','Communiceren tijdens het verlenen van de eerste hulp')}`;
  if(!st.submitted) html+=`<div class="row"><button class="btn primary" id="f-submit" ${!(st.scores.verband&&st.scores.comm)?'disabled':''}>Inleveren</button></div>`;
  else {
    const res=st.res;
    html+=`<div class="total"><b>${res.score}</b><span>van 2 punten</span></div>
      <p class="small muted">Je zag ${spotted.length} van de ${errs.length} fouten${falseFlags?` en drukte ${falseFlags}× op een moment zonder fout`:''}.</p>
      <ul class="errlist">${errs.map(x=>{const s=spotted.includes(x);return `<li><span class="mark ${s?'y':'n'}">${s?'✓':'✗'}</span><span><b>${x.fr.err.a==='comm'?'Communicatie':'Uitvoering'}:</b> ${esc(x.fr.err.t)}</span></li>`;}).join('')}</ul>
      <div class="sec"><div class="sh"><span>D4 · terugkijkopdracht</span><span class="sc">${res.score}/2</span></div><ul>
        <li><span class="mark ${res.v?'y':'n'}">${res.v?'✓':'✗'}</span><span>Uitvoering: passende score met een uitleg en één voorbeeld${res.v?'':'<span class="tip">Kies een score die past bij wat je zag en noem een fout of goed punt uit het filmpje.</span>'}</span></li>
        <li><span class="mark ${res.c?'y':'n'}">${res.c?'✓':'✗'}</span><span>Communicatie: passende score met een uitleg en één voorbeeld${res.c?'':'<span class="tip">Noem iets wat de stagiair zei of deed tegen de cliënt.</span>'}</span></li></ul></div>
      <div class="row"><button class="btn ghost" id="f-again">Opnieuw kijken</button><button class="btn primary" data-go="res">Naar de uitslag</button></div>`;
  }
  return html+'</section>';
}
function judgeExpl(c,k,score,text){
  const t=(text||'').toLowerCase(), words=t.split(/\s+/).filter(Boolean).length;
  const errs=c.film.frames.filter(f=>f.err&&f.err.a===k).map(f=>f.err);
  if(words<5) return false;
  if(errs.length && score==='goed') return false;
  const hitsErr=errs.some(e=>e.k.some(w=>t.includes(w)));
  return hitsErr || words>=12;
}
function drawFrame(c){
  const f=c.film, stage=$('#stage'); if(!stage) return;
  let i=FILM.starts.findIndex((s,k)=>FILM.t>=s && FILM.t<s+f.frames[k].d); if(i<0) i=f.frames.length-1;
  if(FILM.cur!==i || !stage.firstChild){
    FILM.cur=i; const fr=f.frames[i];
    stage.innerHTML=`<div class="fig s ${fr.who==='s'&&FILM.playing?'talk':''}">${figSVG('var(--ink)',f.sIni,'var(--blue)')}</div>
      <div class="fig c ${fr.who==='c'&&FILM.playing?'talk':''}">${figSVG('var(--coral)',f.cIni,'var(--muted)')}</div>
      <span class="tag s">${esc(f.s)} · stagiair</span><span class="tag c">${esc(f.c)}</span>
      ${fr.say?`<div class="bubble ${fr.who}">${esc(fr.say)}</div>`:''}
      ${fr.act?`<div class="actcard">${ico(fr.act.i)}<span>${esc(fr.act.t)}</span></div>`:''}
      <div class="flash" id="flash"></div>
      ${!FILM.playing&&FILM.t===0?'<div class="playcover"><span>▶ Afspelen</span></div>':''}`;
    $('#subs').textContent=(fr.who?(fr.who==='s'?f.s:f.c)+': “'+fr.say+'”  ':'')+(fr.act?fr.act.t:'');
  }
  $('#fill').style.width=(FILM.t/FILM.total*100)+'%';
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  $('#time').textContent=fmt(FILM.t)+' / '+fmt(FILM.total);
}
function bindFilm(c){
  const st=runtime.film; bindIntro();
  document.querySelectorAll('[data-fmode]').forEach(b=>b.onclick=()=>{ stopFilm(); st.mode=b.dataset.fmode; render(); });
  if(st.mode==='own'){ bindOwn(c,st); return; }
  FILM.cur=-1; drawFrame(c);
  const tick=(now)=>{ if(!FILM.playing) return; const dt=(now-FILM.last)/1000; FILM.last=now; FILM.t=Math.min(FILM.total,FILM.t+dt); drawFrame(c);
    if(FILM.t>=FILM.total){ FILM.playing=false; FILM.raf=null; if(!st.ended){st.ended=true; render();} else { $('#play').textContent='Opnieuw'; FILM.cur=-1; drawFrame(c);} return; }
    FILM.raf=requestAnimationFrame(tick); };
  const play=()=>{ if(FILM.playing){ stopFilm(); $('#play').textContent='Afspelen'; FILM.cur=-1; drawFrame(c); return; }
    if(FILM.t>=FILM.total) FILM.t=0; FILM.playing=true; FILM.last=performance.now(); $('#play').textContent='Pauze'; FILM.cur=-1; drawFrame(c); FILM.raf=requestAnimationFrame(tick); };
  $('#play').onclick=play;
  $('#stage').onclick=()=>{ if(!FILM.playing) play(); };
  $('#bar').onclick=(e)=>{ const r=e.currentTarget.getBoundingClientRect(); FILM.t=Math.max(0,Math.min(FILM.total,(e.clientX-r.left)/r.width*FILM.total)); FILM.cur=-1; drawFrame(c); };
  $('#flag').onclick=()=>{ if(FILM.t<=0) return; st.flags.push(FILM.t); const fl=$('#flash'); if(fl){fl.classList.add('on'); setTimeout(()=>fl.classList.remove('on'),300);} const bar=$('#bar'); const m=document.createElement('span'); m.className='flag'; m.style.left=(FILM.t/FILM.total*100)+'%'; bar.appendChild(m); };
  document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{ const [k,s]=b.dataset.score.split(':'); st.scores[k]=s; keepExpl(st); render(); });
  document.querySelectorAll('[data-ex]').forEach(t=>t.oninput=()=>{ st.expl[t.dataset.ex]=t.value; });
  const sb=$('#f-submit'); if(sb) sb.onclick=()=>{ keepExpl(st);
    const v=judgeExpl(c,'verband',st.scores.verband,st.expl.verband), cm=judgeExpl(c,'comm',st.scores.comm,st.expl.comm);
    st.res={v,c:cm,score:(v?1:0)+(cm?1:0)}; st.submitted=true; R(c.id).o4={score:st.res.score}; save(); render(); };
  const ag=$('#f-again'); if(ag) ag.onclick=()=>{ runtime.film={flags:[],ended:false,scores:{},expl:{},submitted:false,mode:'film',own:{}}; FILM.t=0; render(); };
}
function keepExpl(st){ document.querySelectorAll('[data-ex]').forEach(t=>st.expl[t.dataset.ex]=t.value); }

function ownVideoView(c,st,tabs){
  const steps=c.ehbo.steps;
  return `<div class="opd">${opdHead(4,2)}<div class="content">
    <h2>Terugkijken met een eigen video</h2>
    ${tabs}
    <div class="boekje"><p>Heb je een filmpje van jezelf of een klasgenoot (bijvoorbeeld opgenomen tijdens de les)? Open het hier en vul de kijkwijzer in. De video blijft op jouw apparaat en wordt nergens opgeslagen.</p></div>
    <label class="btn ghost" style="align-self:flex-start">Video kiezen<input type="file" accept="video/*" id="own-file" hidden></label>
    <div id="own-player">${st.ownUrl?`<video src="${st.ownUrl}" controls playsinline></video>`:''}</div>
    <div class="tablewrap"><table class="kw"><thead><tr><th>Stap (kijkwijzer)</th><th class="c">Goed</th><th class="c">Fout</th><th class="c">Niet gezien</th></tr></thead><tbody>
      ${steps.map((s,i)=>`<tr><td>${esc(s)}</td>${['g','f','n'].map(v=>`<td class="c"><input type="radio" name="kw${i}" data-kw="${i}" value="${v}" ${st.own[i]===v?'checked':''} aria-label="${v}"></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <label style="font-weight:700;display:grid;gap:6px">Top: wat ging goed?<textarea id="own-top">${esc(st.ownTop||'')}</textarea></label>
    <label style="font-weight:700;display:grid;gap:6px">Tip: wat kan beter? Geef één voorbeeld.<textarea id="own-tip">${esc(st.ownTip||'')}</textarea></label>
    <div class="row"><button class="btn primary" id="own-copy">Feedback kopiëren</button><span class="small muted" id="own-msg"></span></div>
    <textarea id="own-out" hidden readonly></textarea>
  </div></div>`;
}
function bindOwn(c,st){
  const fi=$('#own-file'); fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; if(st.ownUrl) URL.revokeObjectURL(st.ownUrl); st.ownUrl=URL.createObjectURL(f); $('#own-player').innerHTML=`<video src="${st.ownUrl}" controls playsinline></video>`; };
  document.querySelectorAll('[data-kw]').forEach(r=>r.onchange=()=>{ st.own[r.dataset.kw]=r.value; });
  $('#own-top').oninput=e=>st.ownTop=e.target.value; $('#own-tip').oninput=e=>st.ownTip=e.target.value;
  $('#own-copy').onclick=()=>{
    const map={g:'goed',f:'fout',n:'niet gezien'};
    const txt=`Kijkwijzer ${c.ehbo.who} (oefenexamen ${c.id}) — ${S.name||'leerling'} ${S.klas||''}\n`+c.ehbo.steps.map((s,i)=>`${i+1}. ${s}: ${map[st.own[i]]||'-'}`).join('\n')+`\nTop: ${st.ownTop||'-'}\nTip: ${st.ownTip||'-'}`;
    copyText(txt,$('#own-out'),$('#own-msg'));
  };
}
function copyText(txt,area,msg){
  const fallback=()=>{ area.hidden=false; area.value=txt; area.style.minHeight='160px'; area.focus(); area.select(); msg.textContent='Selecteer en kopieer de tekst hieronder.'; };
  try{ navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Gekopieerd.';},fallback); }catch(e){ fallback(); }
}

/* ---------- UITSLAG ---------- */
function resView(c){
  const r=S.results[c.id]||{};
  const M=MAX(); const rows=[['1','Vragen maken','o1',(r.o1&&r.o1.max)||M.o1],['2','Zorg-op-maatopdracht','o2',(r.o2&&r.o2.max)||M.o2],['3','EHBO-opdracht','o3',9],['4','Terugkijkopdracht','o4',2]];
  const tot=rows.reduce((a,x)=>a+(r[x[2]]?r[x[2]].score:0),0), doneAll=rows.every(x=>r[x[2]]);
  return `<div class="opd"><div class="marg"><span class="nr">Σ</span></div><div class="content">
    <h2>Uitslag oefenexamen ${c.id} · ${esc(c.place)}</h2>
    <p class="muted">${esc(S.name||'Naam nog niet ingevuld')}${S.klas?' · '+esc(S.klas):''} · niveau ${S.level.toUpperCase()}</p>
    <div class="tablewrap"><table class="restab"><thead><tr><th>Opdracht</th><th></th><th class="r">Score</th><th class="r">Max</th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td>D${x[0]}</td><td>${x[1]}${x[2]==='o2'&&r.o2?`<div class="small muted">${r.o2.secs.map(s=>s.code+' '+s.pts+'/'+s.max).join(' · ')} · ${modeText(r.o2.mode,r.o2.peeks,r.o2.hints)}</div>`:''}${x[2]==='o2'&&r.o2&&r.o2.disputes&&r.o2.disputes.length?`<div class="small" style="color:var(--warn)">Betwist door leerling: ${r.o2.disputes.map(esc).join('; ')}</div>`:''}${x[2]==='o3'&&r.o3?`<div class="small muted">materialen ${r.o3.mats}/${r.o3.matMax||2} · volgorde ${r.o3.order}/5 · vragen ${r.o3.oral}/${r.o3.oralMax||2}</div>`:''}</td><td class="r">${r[x[2]]?r[x[2]].score:'–'}</td><td class="r">${x[3]}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2">Totaal onderdeel D</td><td class="r">${tot}</td><td class="r">25</td></tr></tfoot></table></div>
    ${!doneAll?'<p class="chip warn" style="align-self:flex-start">Nog niet alle opdrachten gemaakt.</p>':''}
    <div class="card mailbox">
      <h3>Uitslag naar je docent sturen</h3>
      ${!S.name?'<p class="chip warn" style="align-self:flex-start">Vul eerst je naam in op de startpagina.</p>':''}
      <label for="docent" style="font-weight:700">Naar welke docent?</label>
      <select id="docent"><option value="">Kies je docent …</option>${DOCENTEN.map((d,i)=>`<option value="${i}" ${S.docent===i?'selected':''}>${esc(d.naam)}</option>`).join('')}</select>
      <div class="row">
        <a class="btn primary ${S.docent==null||!S.name?'disabled':''}" id="res-mail" target="_blank" rel="noopener" href="${S.docent!=null&&S.name?esc(mailLink(c)):'#'}" aria-disabled="${S.docent==null||!S.name}">Mail naar docent</a>
        <button class="btn ghost" id="res-copy">Uitslag kopiëren</button><span class="small muted" id="res-msg"></span>
      </div>
      <p class="small muted">Er opent een nieuwe e-mail in Outlook met je uitslag erin. Controleer hem en klik op <b>Verzenden</b>. Werkt de knop niet? Kopieer dan je uitslag en plak die in een mail of in Teams.</p>
    </div>
    <textarea id="res-out" hidden readonly></textarea>
    <p class="note">Dit is een oefenscore: bij het echte cspe beoordeelt de examinator je praktijk.</p>
  </div></div>`;
}
function resultText(c){
    const r=S.results[c.id]||{}; const g=k=>r[k]?r[k].score:'-';
    const tot=['o1','o2','o3','o4'].reduce((a,k)=>a+(r[k]?r[k].score:0),0);
    return `Virtuele cliënt – oefenexamen ${c.id} (${c.place})\n${S.name||'-'} ${S.klas||''} · ${S.level.toUpperCase()}\nD1 vragen: ${g('o1')}/${(r.o1&&r.o1.max)||MAX().o1}\nD2 zorg op maat: ${g('o2')}/${(r.o2&&r.o2.max)||MAX().o2}${r.o2?' ('+r.o2.secs.map(s=>s.code+' '+s.pts+'/'+s.max).join(', ')+'; '+modeText(r.o2.mode,r.o2.peeks,r.o2.hints)+')':''}${r.o2&&r.o2.disputes&&r.o2.disputes.length?'\n   Betwist: '+r.o2.disputes.join('; '):''}\nD3 EHBO: ${g('o3')}/9\nD4 terugkijken: ${g('o4')}/2\nTotaal: ${tot}/25`;
}
function mailLink(c){
  const d=DOCENTEN[S.docent]; if(!d) return '#';
  const subject=`Virtuele cliënt – examen ${c.id} – ${S.name||'leerling'}${S.klas?' '+S.klas:''}`;
  const body=resultText(c).replace(/\n/g,'\r\n');
  return 'https://outlook.office.com/mail/deeplink/compose?to='+encodeURIComponent(d.mail)+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}
function bindRes(c){
  $('#res-copy').onclick=()=>copyText(resultText(c),$('#res-out'),$('#res-msg'));
  $('#docent').onchange=e=>{ S.docent=e.target.value===''?null:+e.target.value; save(); render(); };
  $('#res-mail').onclick=e=>{ if(S.docent==null||!S.name){ e.preventDefault(); } };
}

/* ---------- start ---------- */
render();
(async()=>{
  try{ if(window.claude&&window.claude.use){ const s=await window.claude.use('sample'); if(s){ SAMPLE=s; AI_STATE='on'; } else AI_STATE='off'; } else AI_STATE='none'; }
  catch(e){ AI_STATE='off'; }
  if(view.screen==='case'&&view.tab==='o2' && !(runtime.chat&&runtime.chat.busy)) { const v=document.getElementById('say'); const keep=v?v.value:''; render(); const n=document.getElementById('say'); if(n&&keep) n.value=keep; }
})();
</script>
